# 점수 모델 설정 (초기값은 가설 — 영업 결과가 쌓이면 보정)

# 업태(UPTAENM) → 국산 증류주 적합도 (0~1)
biz_type_fit:
  "정종/대포집/소주방": 1.0
  "횟집": 0.95
  "식육(숯불구이)": 0.95
  "일식": 0.9
  "한식": 0.75
  "중국식": 0.7
  "탕류(보신용)": 0.6
  "감성주점": 0.6
  "복어취급": 0.9
  "외국음식전문점(인도,태국등)": 0.3
  "경양식": 0.35
  "호프/통닭": 0.35
  "라이브카페": 0.3
  "냉면집": 0.3
  "뷔페식": 0.2
  "패밀리레스트랑": 0.2
  "통닭(치킨)": 0.15
  "분식": 0.05
  "김밥(도시락)": 0.0
  "패스트푸드": 0.0
  "까페": 0.0
  "키즈카페": 0.0
default_fit: 0.2

# 상권 매출 집계에 포함할 서비스 업종
district_industries:
  - "한식음식점"
  - "중식음식점"
  - "일식음식점"
  - "양식음식점"
  - "호프-간이주점"

# 상권 점수 가중치 (각 지표는 서울 전체 백분위로 정규화)
district_weights:
  dinner_sales: 0.35     # 17~24시 매출 규모
  avg_ticket: 0.30       # 건당 결제액(객단가 대용)
  dinner_share: 0.15     # 저녁 매출 비중
  age_30_50_share: 0.20  # 30~50대 매출 비중

# 업소 점수 가중치
lead_weights:
  biz_fit: 0.40
  district: 0.35
  size: 0.15
  new_open: 0.10

new_open_months: 24          # 이 기간 내 개업 → 신규 가점
franchise_min_branches: 5    # 같은 브랜드 지점 수가 이 이상이면 프랜차이즈로 간주
franchise_penalty: 0.5       # 점수에 곱함
district_match_radius_m: 400 # 업소 → 가장 가까운 상권 중심 매칭 최대 거리
top_leads: 3000
