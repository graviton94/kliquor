# 점수 모델 설정 (초기값은 가설 — 영업 결과가 쌓이면 보정)

# 업종(중분류 + 소분류 이름) → 국산 증류주 적합도 (0~1)
# 위에서부터 정규식으로 검사해 처음 맞는 규칙을 적용. 순서가 중요합니다.
category_fit_rules:
  - [0.0,  "카페|커피|제과|베이커리|빵|디저트|아이스크림|빙수|떡|도시락|김밥|패스트|버거|샌드위치|토스트|분식|키즈|주스|차 전문"]
  - [0.35, "생맥주|호프"]
  - [0.3,  "무도|유흥"]
  - [1.0,  "요리 주점|민속주점|전통주|이자카야|포장마차|주점"]
  - [0.95, "횟집|회/초밥|복 요리|복어|해산물|장어"]
  - [0.9,  "소고기|돼지고기|곱창|막창|양고기|구이"]
  - [0.85, "한정식|족발|보쌈|전/부침|전골|아귀|찜"]
  - [0.3,  "카레|돈가스|덮밥|일식 면|라멘|우동|소바"]
  - [0.85, "일식"]
  - [0.5,  "마라|훠궈"]
  - [0.6,  "중식|중국"]
  - [0.2,  "치킨|닭강정"]
  - [0.6,  "국/탕|찌개|해장|국밥|감자탕"]
  - [0.3,  "국수|칼국수|냉면|밀면"]
  - [0.65, "백반|한식"]
  - [0.3,  "피자|파스타|스테이크|서양|경양식|양식"]
  - [0.25, "동남아|베트남|태국|인도|외국"]
  - [0.2,  "뷔페"]
default_fit: 0.2
high_fit_threshold: 0.85    # 이 이상을 '증류주 핵심 업종'으로 간주

# 행정동 점수 가중치 (각 지표는 서울 내 백분위)
dong_weights:
  fit_density: 0.5      # 적합도 합계 = 증류주 친화 업소 밀집도
  high_fit_share: 0.3   # 핵심 업종 비중 = 상권 성격
  bar_count: 0.2        # 주점 수 = 음주 상권 강도

# 업소 점수 가중치
lead_weights:
  biz_fit: 0.55
  dong: 0.45

franchise_min_branches: 5    # 같은 상호가 서울에 이 이상 → 프랜차이즈로 간주
franchise_penalty: 0.5       # 점수에 곱함
top_leads: 3000
